apiVersion: apps/v1
kind: Deployment
metadata:
  name: relaydesk-deployment
  labels:
    app: relaydesk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: relaydesk
  template:
    metadata:
      labels:
        app: relaydesk
    spec:
      containers:
        - name: relaydesk
          image: relaydesk:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: relaydesk-config
          volumeMounts:
            - name: sqlite-storage
              mountPath: /app/data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: relaydesk-data-pvc
